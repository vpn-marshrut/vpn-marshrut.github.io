<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220"><title>Три проверки видеосервиса</title><desc>Открытие страницы, запуск ролика и устойчивый поток проверяются как отдельные этапы.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#647ba0" stroke-width="1.5"/></marker></defs><rect width="720" height="220" rx="20" fill="#eef3f8"/><g fill="#fff" stroke="#cad8e8" stroke-width="2"><rect x="20" y="54" width="180" height="112" rx="16"/><rect x="270" y="54" width="180" height="112" rx="16"/><rect x="520" y="54" width="180" height="112" rx="16"/></g><g fill="#253b54" font-size="30" text-anchor="middle" font-family="Arial,sans-serif"><text x="110" y="121">Страница</text><text x="360" y="121">Ролик</text><text x="610" y="121">Поток</text></g><g stroke="#647ba0" stroke-width="3" marker-end="url(#a)"><path d="M210 110h47"/><path d="M460 110h47"/></g></svg>
